<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えびは</title>
<meta name="description" content="えびは の作品置き場。ブラウザで遊べるゲーム「えびダイブ食堂」など。">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="えびは">
<meta property="og:title" content="えびは">
<meta property="og:description" content="えびは の作品置き場。ブラウザで遊べるゲーム「えびダイブ食堂」など。">
<meta property="og:url" content="https://ebihanohito.com/">
<meta property="og:image" content="https://ebihanohito.com/avatar.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@Liebudo_ebiha">
<meta name="theme-color" content="#0b222c">
<link rel="icon" href="avatar.png">
<link rel="apple-touch-icon" href="ebi-dive/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 深海色の1ページ。上にプロフィール、下に作品カードの一覧 */
  :root {
    color-scheme: dark;
    --ground: #0b222c;
    --sea: #0f3a48;
    --panel: #10313c;
    --ink: #e4f2ef;
    --muted: #88adac;
    --line: #21505c;
    --shrimp: #ff7a57;
    --plankton: #c6ef6e;
    --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.75;
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(31,132,153,0.55), transparent 70%),
      var(--ground);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 56px 48px; display: grid; gap: 48px; }

  .profile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
  .avatar { width: 112px; height: 112px; border-radius: 50%; display: block; box-shadow: 0 0 0 3px var(--line), 0 12px 30px rgba(0,0,0,0.35); }
  .who { display: grid; gap: 6px; min-width: 0; }
  .eyebrow { margin: 0; color: var(--plankton); font-size: 13px; letter-spacing: 0.14em; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 7vw, 56px); line-height: 1.1; letter-spacing: 0.02em; }
  .bio { margin: 0; color: var(--ink); max-width: 36em; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .link-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px 7px 8px; border-radius: 999px; background: #000; color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,0.18); }
  .link-btn .x { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #000; }
  .link-btn .x svg { width: 13px; height: 13px; }
  .link-btn:hover { background: #1a1a1a; }
  .link-btn:focus-visible, .play:focus-visible { outline: 3px solid var(--plankton); outline-offset: 3px; }

  .works { display: grid; gap: 18px; }
  .works-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.08em; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 20px; }

  .card { display: grid; grid-template-rows: auto 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .thumb { display: block; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden; background: var(--sea); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .thumb:hover img { transform: scale(1.03); }
  .card-body { display: grid; gap: 10px; padding: 16px 18px 18px; align-content: start; }
  .card-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.3; }
  .card-title span { color: var(--shrimp); }
  .card-desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li { font-size: 11.5px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; line-height: 1.9; }
  .play { justify-self: start; margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 16px; letter-spacing: 0.08em; color: #2a0d05; background: var(--shrimp); border-radius: 999px; padding: 9px 24px; text-decoration: none; box-shadow: 0 4px 0 #e2502c; }
  .play:active { transform: translateY(3px); box-shadow: 0 1px 0 #e2502c; }

  footer { color: var(--muted); font-size: 12.5px; text-align: center; border-top: 1px solid var(--line); padding-top: 18px; }

  @media (max-width: 520px) {
    .wrap { padding-block: 36px 40px; gap: 36px; }
    .profile { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .links { justify-content: center; }
    .avatar { width: 96px; height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <section class="profile" aria-labelledby="name">
    <img class="avatar" src="avatar.png" alt="えびは のアイコン（緑のえびに真珠のネックレス）" width="112" height="112">
    <div class="who">
      <p class="eyebrow">PROFILE</p>
      <h1 id="name">えびは</h1>
      <p class="bio">ブラウザで遊べるゲームなどを作っています。作ったものはこのページにまとめていきます。</p>
      <div class="links">
        <a class="link-btn" href="https://x.com/Liebudo_ebiha" target="_blank" rel="noopener">
          <span class="x"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>
          @Liebudo_ebiha
        </a>
      </div>
    </div>
  </section>

  <section class="works" aria-labelledby="works-title">
    <div class="works-head">
      <h2 id="works-title">作品</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid">
      <!-- 作品を増やすときは、この article をコピーして中身を書き換える -->
      <article class="card">
        <a class="thumb" href="ebi-dive/" aria-label="えびダイブ食堂を遊ぶ"><img src="ebi-dive/thumbnail.png" alt="えびダイブ食堂のタイトル画像" loading="lazy" width="1920" height="1080"></a>
        <div class="card-body">
          <h3 class="card-title">えびダイブ<span>食堂</span></h3>
          <p class="card-desc">えびを操って60秒間プランクトンを食べるブラウザゲーム。大きく育てるほど豪華な料理に。ランキング、ハードモード、宝物図鑑、着せかえも。</p>
          <ul class="tags"><li>ブラウザゲーム</li><li>PC・スマホ</li><li>無料</li></ul>
          <a class="play" href="ebi-dive/">遊ぶ</a>
        </div>
      </article>
    </div>
  </section>

  <footer>© えびは</footer>
</main>
<script>
  document.getElementById('count').textContent = document.querySelectorAll('#grid .card').length + ' 作品';
</script>
</body>
</html>
